name: Bounded source discovery (disabled until opted in)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
concurrency:
  group: source-discovery
  cancel-in-progress: false
jobs:
  paris:
    if: vars.DISCOVERY_ENABLED == 'true' && github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCOVERY_ENABLED: 'true'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run discover -- --remote
