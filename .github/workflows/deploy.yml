name: Verified frontend deployment (owner opt-in)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-release
  cancel-in-progress: false
jobs:
  release:
    if: vars.DEPLOY_ENABLED == 'true' && github.event.repository.private
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:data
      - name: Check public frontend configuration
        run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_PUBLIC_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLIC_KEY }}
      - run: npm run build
        env:
          VITE_DATA_MODE: supabase
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_PUBLIC_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLIC_KEY }}
      - name: Publish only the built frontend
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main
        env:
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
